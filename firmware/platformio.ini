; Pool table controller firmware. Build:  pio run -e esp32dev      Test on PC:  pio test -e native   (or tools/run-native-tests.sh)
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv       ; two OTA slots
board_build.embed_txtfiles = certs/server_ca.pem
                             certs/ota_pub.pem
extra_scripts = pre:tools/check_certs.py
build_flags = -std=gnu++17 -DFW_VERSION=\"1.0.0\" -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
lib_deps = olikraus/U8g2@2.35.19              ; optional OLED (compiled only when USE_OLED is defined)

[env:esp32dev_oled]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DUSE_OLED=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Wno-misleading-indentation
