name: CI
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.x }
      - run: pip install opencv-python-headless numpy reportlab    # lets the QR tests decode real QR images
      - run: npm install --no-audit --no-fund                      # dev tools only (typescript, @types/node); the app has zero runtime dependencies
      - name: Lint (syntax of the browser code)
        run: for f in web/*.js web/lib/*.js; do node --check "$f"; done
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Load test (50 tables, 30 concurrent payments)
        run: npm run load
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh firmware/tools/run-native-tests.sh                 # portable core, ASan + UBSan
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install platformio
      - name: Build ESP32 image (with throw-away test certificates)
        working-directory: firmware
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /dev/null -out certs/server_ca.pem -days 1 -subj "/CN=ci"
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/ota.pem && openssl ec -in /tmp/ota.pem -pubout -out certs/ota_pub.pem
          pio run -e esp32dev
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/amd64,linux/arm64 -t pooltable:ci .
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: gradle assembleDebug -PserverUrl=https://example.com
